[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-tracker"
version = "0.1.0"
description = "Local bank statement analysis with OpenAI and a stdio MCP server"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "mcp>=2.0,<3",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "reportlab>=4,<5"]

[project.scripts]
finance-analyze = "finance_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
