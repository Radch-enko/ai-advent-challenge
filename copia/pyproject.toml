[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copia"
version = "0.1.0"
description = "A personal multi-provider AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
copia-api = "copia.api.service:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".env", ".venv"]

[tool.setuptools.packages.find]
where = ["src"]
