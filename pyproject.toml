[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-assistance"
version = "0.1.0"
description = "A local read-only assistant for Git repository documentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3.0",
    "openai>=1.66,<3.0",
    "platformdirs>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
code-assistance = "code_assistance.cli:main"
code-assistance-git-mcp = "code_assistance.git_mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/code_assistance"]
