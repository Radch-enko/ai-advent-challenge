[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copia"
version = "0.1.0"
description = "A personal multi-provider AI assistant"
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "openpyxl>=3.1,<4",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "tiktoken>=0.8,<1",
    "uvicorn>=0.30,<1",
    "opentelemetry-api>=1.28,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "mypy>=1.11,<2",
]
observability = [
    "opentelemetry-sdk>=1.28,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
    "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
    "opentelemetry-instrumentation-httpx>=0.49b0,<1",
]

[project.scripts]
copia-api = "copia.service:run"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".env", ".venv"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"copia.providers.data" = ["model_context_windows.json"]
"copia.common" = ["prompts/*.md"]
"copia.sessions" = ["prompts/*.md"]
"copia.session_memory" = ["prompts/*.md"]
"copia.tasks" = ["prompts/*.md"]
"copia.scheduled_jobs" = ["prompts/*.md"]
